name: Fix icons
on: [push]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert icon-512.png -resize 192x192! icon-192.png
          convert icon-512.png -resize 512x512! icon-512.png
          convert icon-512.png -resize 1024x1024! icon-1024.png
      - run: |
          git config user.name "fix"
          git config user.email "fix@fix.com"
          git add icon-*.png
          git diff --staged --quiet || (git commit -m "fix icons exact sizes" && git push)

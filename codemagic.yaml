workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Morad Admin"
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Prep
        script: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 --save --force
          mkdir -p dist
          cp index.html manifest.json *.png dist/ 2>/dev/null || true
          cp sw.js dist/ 2>/dev/null || true
          echo '{"appId":"com.ouaid.tolleranze","appName":"Tolleranze","webDir":"dist"}' > capacitor.config.json
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios/App && pod install --repo-update && cd ../..
      - name: Code Signing DEBUG
        script: |
          set -x
          keychain initialize
          app-store-connect fetch-signing-files com.ouaid.tolleranze --type IOS_APP_STORE --create --platform IOS -v || true
          echo "--- LIST FILES ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ || true
          keychain add-certificates
          xcode-project use-profiles --warn-only
      - name: Build IPA with AUTO signing
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App --archive-flags="CODE_SIGN_STYLE=Manual"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Create Project and iOS
        script: |
          if [ ! -f package.json ]; then
            echo "Creo package.json mancante"
            echo '{"name":"morad-tolleranze","version":"1.0.0","private":true}' > package.json
          fi
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save
          mkdir -p dist
          if [ -f index.html ]; then cp index.html dist/index.html || true; fi
          if [ ! -f dist/index.html ]; then echo "<html><body><h1>Morad</h1></body></html>" > dist/index.html; fi
          echo '{"appId":"com.morad.tolleranze","appName":"Tolleranze Morad","webDir":"dist"}' > capacitor.config.json
          npx cap add ios
          npx cap copy ios
          ls -R ios | head -n 100
      - name: Set Blue Icon
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f AppIcon.png ]; then
            cp AppIcon.png "$ICONSET/AppIcon-1024.png"
            sips -z 180 180 AppIcon.png --out "$ICONSET/AppIcon-60@3x.png" || true
            sips -z 120 120 AppIcon.png --out "$ICONSET/AppIcon-60@2x.png" || true
            echo "Icona BLU messa"
          fi
      - name: Build IPA
        script: |
          cd ios/App && pod install --repo-update
          cd ../..
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

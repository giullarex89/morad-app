workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Morad API
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Setup Project
        script: |
          if [ ! -f package.json ]; then echo '{"name":"morad-tolleranze","version":"1.0.0","private":true}' > package.json; fi
          npm install --force
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 --save
          mkdir -p dist && cp index.html dist/ 2>/dev/null || echo "<h1>App</h1>" > dist/index.html
          echo '{"appId":"com.morad.tolleranze","appName":"Tolleranze Morad","webDir":"dist"}' > capacitor.config.json
          rm -rf ios && npx cap add ios
          cd ios/App && pod install --repo-update && cd ../..
      - name: Fix Icon Blu
        script: |
          ICON_SRC=$(ls | grep -i "appicon.*png" | head -n 1)
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -n "$ICON_SRC" ]; then cp "$ICON_SRC" "$ICONSET/AppIcon-1024.png"; fi
      - name: Setup signing with Apple 99€
        script: |
          app-store-connect bundle-ids register --bundle-id-identifier com.morad.tolleranze --bundle-id-name "Tolleranze Morad" || true
          app-store-connect certificates create --type IOS_DISTRIBUTION --save || true
          app-store-connect fetch-signing-files com.morad.tolleranze --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA Firmata
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

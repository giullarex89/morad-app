workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Morad Admin"
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Prep Web Assets & Capacitor
        script: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 --save --force
          mkdir -p dist
          cp index.html manifest.json *.png dist/ 2>/dev/null || true
          cp sw.js dist/ 2>/dev/null || true
          echo '{"appId":"com.ouaid.tolleranze","appName":"ISO Tolleranze","webDir":"dist"}' > capacitor.config.json
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios/App && pod install --repo-update && cd ../..
      - name: Code Signing - NEW CERT
        script: |
          keychain initialize
          app-store-connect certificates create --type IOS_DISTRIBUTION --save
          app-store-connect fetch-signing-files "com.ouaid.tolleranze" --type IOS_APP_STORE --platform IOS --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

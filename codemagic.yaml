workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze

    scripts:
      - name: Prepare Capacitor project
        script: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp icon-192.png www/ || true
          if [ -f AppIcon.png ]; then cp AppIcon.png Icon-1024.png; fi
          if [ -f icon-1024.png ]; then cp icon-1024.png Icon-1024.png; fi
          if [ ! -f Icon-1024.png ]; then echo "Manca Icon-1024.png!"; exit 1; fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ouaid.tolleranze",
            "appName": "Tolleranze",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: FIX DEFINITIVO ICONA
        script: |
          set -e
          ICON_SRC="Icon-1024.png"
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p $DEST

          echo "Forzo app SOLO iPhone per evitare errori iPad"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = .*/TARGETED_DEVICE_FAMILY = 1;/g' $PROJ
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = .*/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;/g' $PROJ

          # Rimuovo trasparenza e genero icone iPhone
          sips -s format png --deleteColorManagementProperties "$ICON_SRC" --out /tmp/icon-noalpha.png
          ICON_SRC="/tmp/icon-noalpha.png"

          sips -z 40 40   "$ICON_SRC" --out $DEST/AppIcon-20@2x.png
          sips -z 60 60   "$ICON_SRC" --out $DEST/AppIcon-20@3x.png
          sips -z 58 58   "$ICON_SRC" --out $DEST/AppIcon-29@2x.png
          sips -z 87 87   "$ICON_SRC" --out $DEST/AppIcon-29@3x.png
          sips -z 80 80   "$ICON_SRC" --out $DEST/AppIcon-40@2x.png
          sips -z 120 120 "$ICON_SRC" --out $DEST/AppIcon-40@3x.png
          sips -z 120 120 "$ICON_SRC" --out $DEST/AppIcon-60@2x.png
          sips -z 180 180 "$ICON_SRC" --out $DEST/AppIcon-60@3x.png
          sips -z 1024 1024 "$ICON_SRC" --out $DEST/AppIcon-1024.png

          cat > $DEST/Contents.json <<'EOF'
          {
            "images": [
              {"filename":"AppIcon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"AppIcon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"AppIcon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"AppIcon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"AppIcon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"AppIcon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"AppIcon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"AppIcon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"AppIcon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          EOF

          INFO_PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" $INFO_PLIST || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad" $INFO_PLIST || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" $INFO_PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" $INFO_PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" $INFO_PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" $INFO_PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" $INFO_PLIST
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon-20@2x" $INFO_PLIST

          echo "Fix icona fatto! Ora è solo iPhone."

      - name: FIX BUILD NUMBER E VERSION
        script: |
          cd ios/App
          agvtool new-marketing-version 1.1
          agvtool new-version -all $BUILD_NUMBER

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Configure code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze

    scripts:
      - name: Prepare Capacitor project
        script: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp icon-192.png www/ || true
          if [ -f AppIcon.png ]; then cp AppIcon.png Icon-1024.png; fi
          if [ -f icon-1024.png ]; then cp icon-1024.png Icon-1024.png; fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ouaid.tolleranze",
            "appName": "Tolleranze",
            "webDir": "www"
          }
          EOF
          npx cap add ios
          npx cap sync ios

      - name: FIX ICONS + iPad + Info.plist
        script: |
          ICON_SRC="Icon-1024.png"
          DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          INFO="ios/App/App/Info.plist"
          mkdir -p $DEST
          
          # Genera TUTTE le icone iPhone + iPad richieste da Apple
          sips -z 40 40     "$ICON_SRC" --out $DEST/AppIcon-20@2x.png
          sips -z 60 60     "$ICON_SRC" --out $DEST/AppIcon-20@3x.png
          sips -z 29 29     "$ICON_SRC" --out $DEST/AppIcon-29.png
          sips -z 58 58     "$ICON_SRC" --out $DEST/AppIcon-29@2x.png
          sips -z 87 87     "$ICON_SRC" --out $DEST/AppIcon-29@3x.png
          sips -z 40 40     "$ICON_SRC" --out $DEST/AppIcon-40.png
          sips -z 80 80     "$ICON_SRC" --out $DEST/AppIcon-40@2x.png
          sips -z 120 120   "$ICON_SRC" --out $DEST/AppIcon-40@3x.png
          sips -z 120 120   "$ICON_SRC" --out $DEST/AppIcon-60@2x.png
          sips -z 180 180   "$ICON_SRC" --out $DEST/AppIcon-60@3x.png
          sips -z 76 76     "$ICON_SRC" --out $DEST/AppIcon-76.png
          sips -z 152 152   "$ICON_SRC" --out $DEST/AppIcon-76@2x.png
          sips -z 167 167   "$ICON_SRC" --out $DEST/AppIcon-83.5@2x.png
          sips -z 1024 1024 "$ICON_SRC" --out $DEST/AppIcon-1024.png
          
          cat > $DEST/Contents.json <<'EOF'
          {
            "images": [
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"AppIcon-20@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"AppIcon-20@3x.png"},
              {"idiom":"iphone","scale":"1x","size":"29x29","filename":"AppIcon-29.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"AppIcon-29@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"AppIcon-29@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"AppIcon-40@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"AppIcon-40@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"AppIcon-60@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"AppIcon-60@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"AppIcon-20@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"AppIcon-40.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"AppIcon-29.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"AppIcon-29@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"AppIcon-40.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"AppIcon-40@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"AppIcon-76.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"AppIcon-76@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"AppIcon-83.5@2x.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"AppIcon-1024.png"}
            ],
            "info":{"author":"xcode","version":1}
          }
          EOF
          
          # Fix errore 90713 - CFBundleIconName mancante
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" $INFO || /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" $INFO
          echo "Icone iPad + CFBundleIconName sistemati!"

      - name: FIX BUILD NUMBER
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Configure code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

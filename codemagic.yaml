workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Setup Project
        script: |
          if [ ! -f package.json ]; then echo '{"name":"morad-tolleranze","version":"1.0.0","private":true}' > package.json; fi
          npm install --force
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 --save
          mkdir -p dist && cp index.html dist/ 2>/dev/null || true
          echo '{"appId":"com.morad.tolleranze","appName":"Tolleranze Morad","webDir":"dist"}' > capacitor.config.json
          rm -rf ios && npx cap add ios
      - name: Fix and Icon
        script: |
          sed -i '' "s/13.0/14.0/g" ios/App/Podfile || true
          ICON_SRC=$(ls | grep -i "appicon.*png" | head -n 1)
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -n "$ICON_SRC" ]; then cp "$ICON_SRC" "$ICONSET/AppIcon-1024.png"; sips -z 180 180 "$ICON_SRC" --out "$ICONSET/AppIcon-60@3x.png" 2>/dev/null || true; sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-60@2x.png" 2>/dev/null || true; fi
      - name: Build IPA
        script: |
          cd ios/App && pod install --repo-update
          cd ../..
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

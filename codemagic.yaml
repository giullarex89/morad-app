workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Install
        script: |
          npm install
          npx cap add ios || true
          npx cap copy ios
      - name: Icon
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f AppIcon.png ]; then
            mkdir -p "$ICONSET"
            cp AppIcon.png "$ICONSET/AppIcon-1024.png"
            sips -z 180 180 AppIcon.png --out "$ICONSET/AppIcon-60@3x.png" || true
            sips -z 120 120 AppIcon.png --out "$ICONSET/AppIcon-60@2x.png" || true
          fi
      - name: Pods
        script: |
          cd ios/App && pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

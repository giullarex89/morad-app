workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save || true
          mkdir -p dist
          if [ ! -f dist/index.html ] && [ -f index.html ]; then cp index.html dist/ || true; fi
          if [ ! -f dist/index.html ]; then echo "<html><body><h1>Tolleranze Morad</h1></body></html>" > dist/index.html; fi
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.morad.tolleranze","appName":"Tolleranze Morad","webDir":"dist"}' > capacitor.config.json
          fi
          npx --yes @capacitor/cli add ios || true
          npx --yes @capacitor/cli copy ios || true
          ls -R ios || echo "cartella ios non creata"
      - name: Set App Icon
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          if [ -f AppIcon.png ]; then
            echo "Icona blu trovata"
            cp AppIcon.png "$ICONSET/AppIcon-1024.png"
            sips -z 1024 1024 AppIcon.png --out "$ICONSET/AppIcon-1024.png" || true
            sips -z 180 180 AppIcon.png --out "$ICONSET/AppIcon-60@3x.png" || true
            sips -z 120 120 AppIcon.png --out "$ICONSET/AppIcon-60@2x.png" || true
          fi
      - name: Install Pods
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install --repo-update
          else
            echo "Skip pods"
          fi
      - name: Build IPA
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            echo "Cerco workspace..."
            find ios -name "*.xcworkspace" || true
            echo "ERRORE: workspace non trovato"
            ls -la ios/App/ || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa

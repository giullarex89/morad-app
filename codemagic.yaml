workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Clean and Create iOS
        script: |
          rm -rf ios
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save
          mkdir -p dist
          if [ -f index.html ]; then cp index.html dist/index.html || true; fi
          if [ ! -f dist/index.html ]; then echo "<html><body><h1>Morad Tolleranze</h1></body></html>" > dist/index.html; fi
          echo '{"appId":"com.morad.tolleranze","appName":"Tolleranze Morad","webDir":"dist"}' > capacitor.config.json
          cat capacitor.config.json
          npx cap add ios
          npx cap copy ios
          echo "--- CONTENUTO IOS ---"
          ls -R ios
      - name: Set App Icon
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          if [ -f AppIcon.png ]; then
            cp AppIcon.png "$ICONSET/AppIcon-1024.png"
            sips -z 1024 1024 AppIcon.png --out "$ICONSET/AppIcon-1024.png" || true
            sips -z 180 180 AppIcon.png --out "$ICONSET/AppIcon-60@3x.png" || true
            sips -z 120 120 AppIcon.png --out "$ICONSET/AppIcon-60@2x.png" || true
            echo "Icona installata"
          fi
      - name: Pods and Build
        script: |
          cd ios/App && pod install --repo-update
          cd ../..
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

workflows:
  ios-workflow:
    name: Tolleranze iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Healthy Life - Vita Sana
    environment:
      xcode: latest
      node: 22.11.0
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze

    scripts:
      - name: Clean and build
        script: |
          npm install
          npx --yes @capacitor/cli --version || npm i -D @capacitor/cli @capacitor/core
          if grep -q '"build"' package.json; then
            npm run build
          fi
          npx cap add ios || true
          npx cap sync ios || true
          cd ios/App && pod install

      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Configure code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY_KEY_ID
        key_id: M6VY6SU5HF
        issuer_id: fb50db47-7aba-47c7-a9e6-a29837bbec4f
        submit_to_testflight: true

workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic"
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.ouaid.tolleranze --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install deps
        script: |
          npm ci || npm install
          npm install @capacitor/cli @capacitor/core
      - name: Add iOS and build IPA
        script: |
          npx cap add ios || true
          npx cap copy ios
          cd ios/App
          pod install --repo-update
          cd ../..
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App --archive-directory build/ios/xcarchive --ipa-directory build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive

workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic"
    environment:
      xcode: latest
      node: 20
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.ouaid.tolleranze --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build
        script: |
          npm install
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install && cd ../..
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa

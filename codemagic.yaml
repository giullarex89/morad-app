workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic"
    environment:
      xcode: latest
      node: 20
      cocoapods: default
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.ouaid.tolleranze --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Find project and build
        script: |
          pwd
          ls -la
          find . -maxdepth 4 -name package.json
          PROJECT_DIR=$(find . -maxdepth 4 -name package.json | head -n 1 | xargs dirname)
          if [ -n "$PROJECT_DIR" ]; then cd $PROJECT_DIR; fi
          pwd
          ls -la
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          echo '{"appId":"com.ouaid.tolleranze","appName":"Morad","webDir":"."}' > capacitor.config.json
          npx cap add ios || true
          npx cap sync ios
          cd ios/App
          pod install
          cd ../..
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build IPA
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          echo '{"appId":"com.ouaid.tolleranze","appName":"Tolleranze","webDir":"."}' > capacitor.config.json
          npx cap add ios
          cd ios/App && pod install && cd../..
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release archive -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ipa
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist ios/App/exportOptions.plist || echo "export done"

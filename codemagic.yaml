workflows:
  ios-workflow:
    name: Tolleranze iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Healthy Life - Vita Sana
    environment:
      xcode: latest
      node: 22.11.0
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze
    scripts:
      - name: Clean and build
        script: |
          npm install
          npx --yes @capacitor/cli --version || npm i -D @capacitor/cli @capacitor/core
          if grep -q '"build"' package.json; then
            npm run build
          fi
          npx cap add ios || true
          npx cap sync ios || true
          cd ios/App && pod install
      - name: Fix Bundle ID for update
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.ouaid.tolleranze;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/MARKETING_VERSION = .*/MARKETING_VERSION = 1.2;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || echo "platform :ios, '15.0'" >> ios/Podfile
          sed -i '' 's/:ios, .*/:ios, "15.0"/' ios/App/Podfile 2>/dev/null || true
          cd ios/App
          agvtool new-marketing-version 1.2
          agvtool new-version -all $BUILD_NUMBER
      - name: Configure code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

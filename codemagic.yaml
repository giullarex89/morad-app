workflows:
  ios-workflow:
    name: Tolleranze iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Healthy Life - Vita Sana

    environment:
      xcode: latest
      node: 22.11.0
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze

    scripts:

      # ============================================================
      # 1. INSTALLAZIONE E BUILD WEB
      # ============================================================

      - name: Install and Sync
        script: |
          set -e

          echo "======================================"
          echo "INSTALLAZIONE PROGETTO"
          echo "======================================"

          npm install

          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "Nessun comando build trovato."
          fi

          echo "======================================"
          echo "CAPACITOR IOS"
          echo "======================================"

          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

          npx cap copy ios
          npx cap sync ios

          echo "Capacitor completato."


      # ============================================================
      # 2. CONFIGURAZIONE ICONA IOS
      # ============================================================

      - name: Fix Icona App Store
        script: |
          set -e

          echo "======================================"
          echo "CONFIGURAZIONE ICONA TOLLERANZE"
          echo "======================================"

          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          mkdir -p "$ICONSET"

          if [ ! -f "AppIcon.png" ]; then
            echo "ERRORE: AppIcon.png non trovato nella root!"
            exit 1
          fi

          echo "AppIcon.png trovato."

          echo "Dimensioni immagine originale:"
          sips -g pixelWidth -g pixelHeight AppIcon.png

          # Controllo se l'immagine ha trasparenza (canale alpha)
          echo "Controllo canale alpha..."
          if sips -g hasAlpha AppIcon.png | grep -q "yes"; then
            echo "ATTENZIONE: AppIcon.png contiene trasparenza. App Store Connect potrebbe rifiutarla."
            echo "Rimuovo il canale alpha forzatamente..."
            sips -s format png -s formatOptions best --deleteColorManagementProperties AppIcon.png --out AppIcon_noalpha.png
            mv AppIcon_noalpha.png AppIcon.png
            echo "Canale alpha rimosso."
          else
            echo "Nessuna trasparenza rilevata. OK."
          fi


          # --------------------------------------------------------
          # Pulizia vecchie icone
          # --------------------------------------------------------

          echo "Pulizia vecchie icone..."

          rm -f "$ICONSET"/*.png
          rm -f "$ICONSET/Contents.json"


          # --------------------------------------------------------
          # Icona App Store 1024x1024
          # --------------------------------------------------------

          echo "Creo icona 1024x1024..."

          sips -z 1024 1024 AppIcon.png \
            --out "$ICONSET/AppIcon-1024.png"


          # --------------------------------------------------------
          # Icone iPhone
          # --------------------------------------------------------

          echo "Creo icone iPhone..."


          # 20x20 @2x
          sips -z 40 40 AppIcon.png \
            --out "$ICONSET/AppIcon-20x20@2x.png"


          # 20x20 @3x
          sips -z 60 60 AppIcon.png \
            --out "$ICONSET/AppIcon-20x20@3x.png"


          # 29x29 @2x
          sips -z 58 58 AppIcon.png \
            --out "$ICONSET/AppIcon-29x29@2x.png"


          # 29x29 @3x
          sips -z 87 87 AppIcon.png \
            --out "$ICONSET/AppIcon-29x29@3x.png"


          # 40x40 @2x
          sips -z 80 80 AppIcon.png \
            --out "$ICONSET/AppIcon-40x40@2x.png"


          # 40x40 @3x
          sips -z 120 120 AppIcon.png \
            --out "$ICONSET/AppIcon-40x40@3x.png"


          # 60x60 @2x
          sips -z 120 120 AppIcon.png \
            --out "$ICONSET/AppIcon-60x60@2x.png"


          # 60x60 @3x
          sips -z 180 180 AppIcon.png \
            --out "$ICONSET/AppIcon-60x60@3x.png"


          # --------------------------------------------------------
          # Icone iPad (AGGIUNTE PER RISOLVERE L'ERRORE 90023)
          # --------------------------------------------------------

          echo "Creo icone iPad..."

          # iPad 76x76 @2x (152x152)
          sips -z 152 152 AppIcon.png \
            --out "$ICONSET/AppIcon-76x76@2x.png"

          # iPad Pro 83.5x83.5 @2x (167x167)
          sips -z 167 167 AppIcon.png \
            --out "$ICONSET/AppIcon-83.5x83.5@2x.png"


          # --------------------------------------------------------
          # Contents.json
          # --------------------------------------------------------

          echo "Creo Contents.json..."

          printf '%s\n' \
          '{' \
          '  "images" : [' \
          '    {' \
          '      "filename" : "AppIcon-20x20@2x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "2x",' \
          '      "size" : "20x20"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-20x20@3x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "3x",' \
          '      "size" : "20x20"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-29x29@2x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "2x",' \
          '      "size" : "29x29"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-29x29@3x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "3x",' \
          '      "size" : "29x29"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-40x40@2x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "2x",' \
          '      "size" : "40x40"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-40x40@3x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "3x",' \
          '      "size" : "40x40"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-60x60@2x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "2x",' \
          '      "size" : "60x60"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-60x60@3x.png",' \
          '      "idiom" : "iphone",' \
          '      "scale" : "3x",' \
          '      "size" : "60x60"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-76x76@2x.png",' \
          '      "idiom" : "ipad",' \
          '      "scale" : "2x",' \
          '      "size" : "76x76"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-83.5x83.5@2x.png",' \
          '      "idiom" : "ipad",' \
          '      "scale" : "2x",' \
          '      "size" : "83.5x83.5"' \
          '    },' \
          '    {' \
          '      "filename" : "AppIcon-1024.png",' \
          '      "idiom" : "ios-marketing",' \
          '      "scale" : "1x",' \
          '      "size" : "1024x1024"' \
          '    }' \
          '  ],' \
          '  "info" : {' \
          '    "author" : "xcode",' \
          '    "version" : 1' \
          '  }' \
          '}' \
          > "$ICONSET/Contents.json"

          echo "======================================"
          echo "VERIFICA ICONA"
          echo "======================================"

          ls -lah "$ICONSET"

          sips -g pixelWidth -g pixelHeight \
            "$ICONSET/AppIcon-1024.png"

          echo "Contents.json:"
          cat "$ICONSET/Contents.json"

          echo "Icona configurata correttamente."


      # ============================================================
      # 3. IOS DEPLOYMENT TARGET + VERSIONE
      # ============================================================

      - name: Configure iOS 15 and Version
        script: |
          set -e

          echo "======================================"
          echo "CONFIGURAZIONE IOS 15"
          echo "======================================"

          PROJECT="ios/App/App.xcodeproj/project.pbxproj"
          PODFILE="ios/App/Podfile"

          if [ ! -f "$PROJECT" ]; then
            echo "ERRORE: progetto Xcode non trovato!"
            exit 1
          fi


          # --------------------------------------------------------
          # Bundle ID
          # --------------------------------------------------------

          echo "Imposto Bundle ID..."

          sed -i '' \
            's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.ouaid.tolleranze;/g' \
            "$PROJECT"


          # --------------------------------------------------------
          # Deployment Target
          # --------------------------------------------------------

          echo "Imposto iOS 15.0..."

          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$PROJECT"

          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$PROJECT"


          # --------------------------------------------------------
          # Podfile
          # --------------------------------------------------------

          if [ -f "$PODFILE" ]; then

            sed -i '' \
              "s/platform :ios, '13.0'/platform :ios, '15.0'/g" \
              "$PODFILE"

            sed -i '' \
              "s/platform :ios, '14.0'/platform :ios, '15.0'/g" \
              "$PODFILE"

          fi


          # --------------------------------------------------------
          # Controllo Deployment Target
          # --------------------------------------------------------

          echo "Deployment Target presenti:"

          grep "IPHONEOS_DEPLOYMENT_TARGET" "$PROJECT" || true


          # --------------------------------------------------------
          # Versione App
          # --------------------------------------------------------

          echo "======================================"
          echo "VERSIONE APP"
          echo "======================================"

          cd ios/App

          agvtool new-marketing-version 1.4

          agvtool new-version -all "$BUILD_NUMBER"

          cd ../..


          # --------------------------------------------------------
          # CocoaPods
          # --------------------------------------------------------

          echo "======================================"
          echo "POD INSTALL"
          echo "======================================"

          pod install --project-directory=ios/App

          echo "Configurazione completata."


      # ============================================================
      # 4. CONTROLLO FINALE
      # ============================================================

      - name: Final iOS Check
        script: |
          set -e

          echo "======================================"
          echo "CONTROLLO FINALE IOS"
          echo "======================================"

          PROJECT="ios/App/App.xcodeproj/project.pbxproj"

          echo "Deployment Target:"

          grep "IPHONEOS_DEPLOYMENT_TARGET" "$PROJECT" || true


          echo "Forzo eventuali target 13/14 a 15..."

          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$PROJECT"

          sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$PROJECT"


          echo "Controllo AppIcon:"

          ls -lah \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/


          echo "Controllo icona 1024:"

          sips -g pixelWidth -g pixelHeight \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png


          echo "======================================"
          echo "CONTROLLO COMPLETATO"
          echo "======================================"


      # ============================================================
      # 5. CODE SIGNING
      # ============================================================

      - name: Configure code signing
        script: |
          set -e

          echo "======================================"
          echo "CODE SIGNING"
          echo "======================================"

          xcode-project use-profiles


      # ============================================================
      # 6. BUILD IPA
      # ============================================================

      - name: Build IPA
        script: |
          set -e

          echo "======================================"
          echo "BUILD IPA"
          echo "======================================"

          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

          echo "======================================"
          echo "BUILD IPA COMPLETATO"
          echo "======================================"


    # ================================================================
    # ARTIFACTS
    # ================================================================

    artifacts:
      - build/ios/ipa/*.ipa


    # ================================================================
    # APP STORE CONNECT / TESTFLIGHT
    # ================================================================

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

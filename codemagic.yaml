workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      node: 20
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze

    scripts:
      - name: Prepare Capacitor project
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp AppIcon.png www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ouaid.tolleranze",
            "appName": "Morad",
            "webDir": "www"
          }
          EOF

          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Configure code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

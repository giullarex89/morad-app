workflows:
  ios-pwa-build:
    name: iOS PWA:
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save
      - name: Build web
        script: |
          npm run build || echo "build skip"
      - name: Add iOS
        script: |
          npx cap add ios || true
          npx cap copy ios
      - name: Icona 1024
        script: |
          if [ -f AppIcon.png ]; then
            ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$ICONSET"
            sips -z 1024 1024 AppIcon.png --out "$ICONSET/AppIcon-1024.png"
            sips -z 60 60 AppIcon.png --out "$ICONSET/AppIcon-60.png"
            sips -z 120 120 AppIcon.png --out "$ICONSET/AppIcon-60@2x.png"
            sips -z 180 180 AppIcon.png --out "$ICONSET/AppIcon-60@3x.png"
            echo "Icona OK"
          else
            echo "AppIcon.png non trovata"
          fi
      - name: Install Pods
        script: |
          cd ios/App
          pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace $XCODE_WORKSPACE --scheme $XCODE_SCHEME
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

workflows:
  ios-pwa:
    name: iOS PWA Build

    integrations:
      app_store_connect: Morad Admin

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      node: 20
      cocoapods: default

    scripts:

      - name: Setup Project
        script: |
          set -e

          echo "======================================"
          echo "1. PREPARING NPM PROJECT"
          echo "======================================"

          if [ ! -f package.json ]; then
            npm init -y
          fi

          echo "======================================"
          echo "2. INSTALLING CAPACITOR"
          echo "======================================"

          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

          echo "======================================"
          echo "3. PREPARING WEB APP"
          echo "======================================"

          mkdir -p dist

          if [ -f index.html ]; then
            cp index.html dist/index.html
          else
            cat > dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Tolleranze Morad</title>
          </head>
          <body>
            <h1>Tolleranze Morad</h1>
          </body>
          </html>
          EOF
          fi

          echo "======================================"
          echo "4. CREATING CAPACITOR CONFIG"
          echo "======================================"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ouaid.tolleranze",
            "appName": "Morad O. app",
            "webDir": "dist"
          }
          EOF

          echo "======================================"
          echo "5. CREATING IOS PROJECT"
          echo "======================================"

          rm -rf ios

          npx cap add ios

          echo "======================================"
          echo "6. INSTALLING COCOAPODS"
          echo "======================================"

          cd ios/App
          pod install
          cd ../..

          echo "======================================"
          echo "SETUP COMPLETED"
          echo "======================================"

      - name: Configure Code Signing
        script: |
          set -e

          echo "======================================"
          echo "7. INITIALIZING KEYCHAIN"
          echo "======================================"

          keychain initialize

          echo "======================================"
          echo "8. INSTALLING CODE SIGNING CERTIFICATES"
          echo "======================================"

          keychain add-certificates

          echo "======================================"
          echo "9. APPLYING PROVISIONING PROFILES"
          echo "======================================"

          xcode-project use-profiles

          echo "======================================"
          echo "CODE SIGNING CONFIGURED"
          echo "======================================"

      - name: Build IPA
        script: |
          set -e

          echo "======================================"
          echo "10. BUILDING IOS IPA"
          echo "======================================"

          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App

          echo "======================================"
          echo "11. SEARCHING FOR IPA"
          echo "======================================"

          find . -name "*.ipa" -print

          echo "======================================"
          echo "BUILD COMPLETED"
          echo "======================================"

    artifacts:
      - build/ios/ipa/*.ipa

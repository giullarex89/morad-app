workflows:
  ios-workflow:
    name: Tolleranze iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Healthy Life - Vita Sana
    environment:
      xcode: latest
      node: 22.11.0
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ouaid.tolleranze
    scripts:
      - name: Install and Sync
        script: |
          npm install
          if grep -q '"build"' package.json; then npm run build; fi
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap copy ios
          npx cap sync ios
      - name: Fix Icona FINALE - solo AppIcon.png
        script: |
          set -e
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p $ICONSET
          echo "Uso AppIcon.png come sorgente"
          ls -l AppIcon.png
          sips -Z 1024 AppIcon.png --out $ICONSET/AppIcon-1024.png
          cp $ICONSET/AppIcon-1024.png $ICONSET/AppIcon.png
          sips -Z 20 AppIcon.png --out $ICONSET/AppIcon-20x20@1x.png
          sips -Z 40 AppIcon.png --out $ICONSET/AppIcon-20x20@2x.png
          sips -Z 60 AppIcon.png --out $ICONSET/AppIcon-20x20@3x.png
          sips -Z 29 AppIcon.png --out $ICONSET/AppIcon-29x29@1x.png
          sips -Z 58 AppIcon.png --out $ICONSET/AppIcon-29x29@2x.png
          sips -Z 87 AppIcon.png --out $ICONSET/AppIcon-29x29@3x.png
          sips -Z 40 AppIcon.png --out $ICONSET/AppIcon-40x40@1x.png
          sips -Z 80 AppIcon.png --out $ICONSET/AppIcon-40x40@2x.png
          sips -Z 120 AppIcon.png --out $ICONSET/AppIcon-40x40@3x.png
          sips -Z 120 AppIcon.png --out $ICONSET/AppIcon-60x60@2x.png
          sips -Z 180 AppIcon.png --out $ICONSET/AppIcon-60x60@3x.png
          ls -l $ICONSET/
          echo "Icone generate OK"
      - name: Bump Version
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.ouaid.tolleranze;/g' ios/App/App.xcodeproj/project.pbxproj
          cd ios/App
          agvtool new-marketing-version 1.4
          agvtool new-version -all $BUILD_NUMBER
          cd ../..
          pod install --project-directory=ios/App
      - name: Configure code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

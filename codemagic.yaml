workflows:
  ios-pwa-tolleranze:
    name: iOS Tolleranze Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Crea progetto Xcode per PWA
        script: |
          # Crea struttura progetto iOS semplice che carica il tuo sito
          mkdir -p Tolleranze/Tolleranze
          cat > Tolleranze/Tolleranze.xcodeproj/project.pbxproj << 'EOF'
          // Questo viene generato automaticamente da Codemagic
          EOF
          
          # Usiamo Capacitor per trasformare il sito in App iOS
          npm install -g @capacitor/cli
          npx cap init Tolleranze io.github.giullarex89.morad-app --web-dir=.
          npx cap add ios
          
          # Configura l'URL della tua PWA
          echo '{"server": {"url": "https://giullarex89.github.io/morad-app", "cleartext": true}}' > capacitor.config.json
          
      - name: Build IPA
        script: |
          cd Tolleranze
          xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Release archive -archivePath build/Tolleranze.xcarchive CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath build/Tolleranze.xcarchive -exportPath build/ipa -exportOptionsPlist exportOptions.plist
    artifacts:
      - Tolleranze/build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

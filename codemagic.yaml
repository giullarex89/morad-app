- name: Setup Project
  script: |
    set -e

    echo "=== Creating npm project ==="

    if [ ! -f package.json ]; then
      npm init -y
    fi

    echo "=== Installing Capacitor ==="

    npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

    echo "=== Preparing web files ==="

    mkdir -p dist

    if [ -f index.html ]; then
      cp index.html dist/index.html
    else
      cat > dist/index.html <<'EOF'
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Tolleranze Morad</title>
    </head>
    <body>
      <h1>Tolleranze Morad</h1>
    </body>
    </html>
    EOF
    fi

    echo "=== Creating Capacitor configuration ==="

    cat > capacitor.config.json <<'EOF'
    {
      "appId": "com.ouaid.tolleranze",
      "appName": "Tolleranze Morad",
      "webDir": "dist"
    }
    EOF

    echo "=== Creating iOS project ==="

    rm -rf ios

    npx cap add ios

    echo "=== Installing CocoaPods ==="

    cd ios/App
    pod install
    cd ../..

    echo "=== Setup completed ==="

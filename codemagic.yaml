workflows:
  ios-pwa:
    name: iOS PWA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      node: 20
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Capacitor
        script: |
          npm i -g @capacitor/cli
          npm init -y || true
          npm install @capacitor/core @capacitor/ios
          npx cap init "Tolleranze" "com.morad.tolleranze" --web-dir="." || true
          npx cap add ios || true
          # crea config che punta al tuo sito
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.morad.tolleranze",
            "appName": "Tolleranze",
            "webDir": ".",
            "server": {
              "url": "https://giullarex89.github.io/morad-app/",
              "cleartext": true
            }
          }
          EOF
          npx cap copy ios
      - name: Set up code signing
        script: |
          echo $APP_STORE_CONNECT_API_KEY > AuthKey.p8
    artifacts:
      - App/build/*.ipa
      - ios/App/build/*.ipa
